<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Lola & Santi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 45px 20px 60px;

      background: #f7f4ee;
      color: #292821;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 5px 0 8px;

      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: normal;
    }

    .date {
      margin-bottom: 48px;

      font-size: 12px;
      letter-spacing: 3px;
    }

    .intro {
      margin-bottom: 32px;

      font-size: 18px;
      line-height: 1.5;
    }

    input[type="text"] {
      width: 100%;
      padding: 17px;

      border: 1px solid #bbb;
      border-radius: 12px;

      background: white;

      font-size: 16px;
    }

    input[type="file"] {
      display: none;
    }

    .choose {
      display: block;

      width: 100%;
      margin-top: 14px;
      padding: 20px;

      border: 1px solid #292821;
      border-radius: 12px;

      background: white;

      cursor: pointer;
      font-size: 17px;
    }

    #selection {
      margin: 18px 0;

      font-size: 14px;
      opacity: .7;
    }

    button {
      width: 100%;
      padding: 19px;

      border: 0;
      border-radius: 12px;

      background: #292821;
      color: white;

      font-size: 17px;
    }

    .test-note {
      margin-top: 24px;

      font-size: 12px;
      line-height: 1.5;
      opacity: .55;
    }
  </style>
</head>


<body>

  <main class="wrap">

    <h1>Lola & Santi</h1>

    <div class="date">
      12 · 09 · 2026
    </div>


    <div class="intro">
      You saw moments we didn't.<br>
      Share them with us. ♡
    </div>


    <input
      type="text"
      placeholder="Your name (optional)"
    >


    <label class="choose">

      📷 Choose photos & videos

      <input
        id="files"
        type="file"
        accept="image/*,video/*"
        multiple
        onchange="showSelection()"
      >

    </label>


    <div id="selection"></div>


    <button type="button">
      Share photos & videos
    </button>


    <div class="test-note">
      Test version — uploading will be connected next.
    </div>

  </main>


  <script>

    function showSelection() {

      const files =
        Array.from(
          document.getElementById('files').files
        );


      if (!files.length) {

        document.getElementById('selection').innerText =
          '';

        return;
      }


      const totalBytes =
        files.reduce(
          (sum, file) => sum + file.size,
          0
        );


      document.getElementById('selection').innerText =
        files.length +
        (files.length === 1 ? ' file' : ' files') +
        ' · ' +
        formatBytes(totalBytes);
    }


    function formatBytes(bytes) {

      if (!bytes) {
        return '0 B';
      }


      const units =
        ['B', 'KB', 'MB', 'GB', 'TB'];


      const index =
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        );


      return (
        (bytes / Math.pow(1024, index))
          .toFixed(index >= 2 ? 1 : 0)
        +
        ' '
        +
        units[index]
      );
    }

  </script>

</body>
</html>
