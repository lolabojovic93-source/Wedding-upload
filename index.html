<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Lola & Santi</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {
      --paper: #f7f3e9;
      --ink: #24231d;
      --muted: #716e65;
      --gold: #d6a52b;
      --line: rgba(36, 35, 29, .22);
    }


    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
    }


    body {

      margin: 0;
      min-height: 100vh;

      padding:
        24px
        20px
        70px;

      color: var(--ink);

      font-family:
        "Courier Prime",
        "Courier New",
        monospace;

      text-align: center;

      background-color:
        var(--paper);

      background-image:

        linear-gradient(
          rgba(247,243,233,.76),
          rgba(247,243,233,.76)
        ),

        url("Ohrid paper.png");

      background-size:
        cover;

      background-position:
        center bottom;

      background-repeat:
        no-repeat;

      background-attachment:
        fixed;
    }


    .wrap {

      width: 100%;

      max-width: 560px;

      margin: 0 auto;
    }


    .language-switcher {

      display: flex;

      justify-content: flex-end;

      align-items: center;

      gap: 16px;

      margin-bottom: 28px;
    }


    .lang-button {

      width: auto;

      padding: 4px 0;

      border: 0;

      background: transparent;

      color: var(--ink);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: .08em;

      cursor: pointer;

      opacity: .38;

      transition:
        opacity .2s ease;
    }


    .lang-button:hover {
      opacity: .7;
    }


    .lang-button.active {

      opacity: 1;

      text-decoration: underline;

      text-decoration-thickness: 1px;

      text-underline-offset: 4px;
    }


    .brand {

      margin-bottom: 42px;
    }


    .sun-mark {

      display: block;

      width: 56px;

      height: 56px;

      object-fit: contain;

      margin:
        0 auto 13px;
    }


    h1 {

      margin:
        0 0 7px;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 22px;

      font-weight: 700;

      letter-spacing: .06em;

      text-transform: uppercase;
    }


    .date {

      font-size: 11px;

      letter-spacing: .22em;
    }


    .intro {

      max-width: 430px;

      margin:
        0 auto 38px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 18px;

      line-height: 1.55;
    }


    input[type="text"] {

      width: 100%;

      padding:
        17px 15px;

      border:
        1px solid var(--ink);

      border-radius: 3px;

      outline: none;

      background:
        rgba(255,255,255,.70);

      color: var(--ink);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 15px;

      transition:
        background .2s ease,
        border-color .2s ease;
    }


    input[type="text"]:focus {

      background:
        rgba(255,255,255,.9);

      border-color:
        var(--gold);
    }


    input[type="text"]::placeholder {

      color: var(--muted);

      opacity: .78;
    }


    input[type="file"] {
      display: none;
    }


    .choose {

      display: block;

      width: 100%;

      margin-top: 11px;

      padding: 18px;

      border:
        1px solid var(--ink);

      border-radius: 3px;

      background:
        rgba(255,255,255,.66);

      cursor: pointer;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 15px;

      font-weight: 700;

      transition:
        background .2s ease,
        transform .15s ease;
    }


    .choose:hover {

      background:
        rgba(255,255,255,.9);
    }


    .choose:active {

      transform:
        translateY(1px);
    }


    .original-box {

      margin-top: 16px;

      border-top:
        1px solid var(--line);

      border-bottom:
        1px solid var(--line);

      text-align: left;
    }


    .original-box summary {

      padding:
        14px 1px;

      cursor: pointer;

      list-style: none;

      color: var(--muted);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 12px;

      line-height: 1.35;
    }


    .original-box summary::-webkit-details-marker {
      display: none;
    }


    .original-box summary::after {

      content: "+";

      float: right;

      color: var(--ink);
    }


    .original-box[open] summary::after {
      content: "−";
    }


    .original-content {

      padding:
        1px 0 17px;

      color: var(--muted);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 11px;

      line-height: 1.55;
    }


    .original-content strong {

      color: var(--ink);

      font-weight: 700;
    }


    .original-button {

      display: block;

      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border:
        1px solid var(--line);

      border-radius: 3px;

      background:
        rgba(255,255,255,.40);

      color: var(--ink);

      text-align: center;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background .2s ease;
    }


    .original-button:hover {

      background:
        rgba(255,255,255,.75);
    }


    .summary {

      margin:
        18px 0 12px;

      color: var(--muted);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 11px;
    }


    .file-card {

      margin:
        9px 0;

      padding:
        13px 14px;

      border:
        1px solid rgba(36,35,29,.13);

      border-radius: 3px;

      background:
        rgba(255,255,255,.62);

      text-align: left;
    }


    .file-top {

      display: flex;

      justify-content: space-between;

      gap: 12px;
    }


    .file-name {

      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 12px;

      font-weight: 700;
    }


    .file-size {

      flex-shrink: 0;

      color: var(--muted);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 10px;
    }


    .status {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 9px;

      color: var(--muted);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 10px;
    }


    .progress {

      height: 3px;

      margin-top: 8px;

      overflow: hidden;

      background:
        rgba(36,35,29,.12);
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        var(--gold);

      transition:
        width .15s ease;
    }


    .saving-note {

      margin-left: 5px;

      opacity: .7;
    }


    #uploadButton {

      width: 100%;

      margin-top: 22px;

      padding:
        17px 20px;

      border:
        1px solid var(--ink);

      border-radius: 3px;

      background: var(--ink);

      color: #fffdf6;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: .08em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        opacity .2s ease,
        transform .15s ease;
    }


    #uploadButton:hover {
      opacity: .88;
    }


    #uploadButton:active {
      transform: translateY(1px);
    }


    #uploadButton:disabled {

      opacity: .38;

      cursor: default;
    }


    #overall {

      margin-top: 24px;

      font-family:
        "Courier Prime",
        monospace;

      font-size: 13px;

      line-height: 1.55;
    }


    .success-symbol {

      display: block;

      margin-bottom: 6px;

      color: var(--gold);

      font-family:
        Georgia,
        serif;

      font-size: 31px;
    }


    .secondary {

      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border:
        1px solid var(--ink);

      border-radius: 3px;

      background:
        rgba(255,255,255,.32);

      color: var(--ink);

      font-family:
        "Courier Prime",
        monospace;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;
    }


    @media (min-width: 700px) {

      body {
        padding-top: 30px;
      }


      .brand {
        margin-bottom: 38px;
      }


      .intro {
        margin-bottom: 34px;
      }
    }


    @media (max-width: 480px) {

      body {

        padding:
          20px
          17px
          55px;

        background-attachment:
          scroll;

        background-size:
          auto 100%;
      }


      .language-switcher {

        margin-bottom: 23px;
      }


      .sun-mark {

        width: 51px;

        height: 51px;
      }


      h1 {

        font-size: 19px;
      }


      .brand {

        margin-bottom: 34px;
      }


      .intro {

        margin-bottom: 31px;

        font-size: 17px;
      }


      .choose {

        padding:
          17px 12px;
      }


      #uploadButton {

        margin-top: 20px;
      }
    }

  </style>

</head>


<body>


<main class="wrap">


  <div class="language-switcher">

    <button
      class="lang-button active"
      data-lang="en"
      onclick="setLanguage('en')">
      EN
    </button>

    <button
      class="lang-button"
      data-lang="es"
      onclick="setLanguage('es')">
      ES
    </button>

    <button
      class="lang-button"
      data-lang="mk"
      onclick="setLanguage('mk')">
      MK
    </button>

  </div>


  <header class="brand">

    <img
      class="sun-mark"
      src="Ohrid sun.png"
      alt=""
    >


    <h1>
      Lola & Santi
    </h1>


    <div class="date">
      12 · 09 · 2026
    </div>

  </header>


  <div
    id="intro"
    class="intro">
  </div>


  <input
    id="guestName"
    type="text"
  >


  <label
    id="chooseLabel"
    class="choose">

    <span id="chooseText">
    </span>


    <input
      id="photoFiles"
      type="file"
      accept="image/*,video/*"
      multiple
      onchange="filesSelected(this.files)"
    >

  </label>


  <details class="original-box">

    <summary id="originalTitle">
    </summary>


    <div class="original-content">

      <div id="originalExplanation">
      </div>


      <label class="original-button">

        <span id="originalButtonText">
        </span>


        <input
          id="originalFiles"
          type="file"
          multiple
          onchange="filesSelected(this.files)"
        >

      </label>

    </div>

  </details>


  <div
    id="summary"
    class="summary">
  </div>


  <div id="fileList">
  </div>


  <button
    id="uploadButton"
    type="button"
    onclick="startUpload()">
  </button>


  <div id="overall">
  </div>


</main>


<script>


const BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbx2vdi2nqGoyrrNToJhu0JrElylkWVM1knWDGrYA7LbFjWodyJDFM3S17uxhsq5Nv8ffg/exec';


const CHUNK_SIZE =
  8 * 1024 * 1024;


const MAX_RETRIES =
  5;


const translations = {


  en: {

    intro:
      "You saw moments we didn't.<br>Share them with us. ♡",

    name:
      "Your name (optional)",

    choose:
      "📷 Choose photos & videos",

    originalTitle:
      "Sending a large or long video?",

    originalExplanation:
      "For large or long videos, iPhone may prepare a smaller version when choosing from Photos. To send the original file, save it to <strong>Files</strong> first and upload it below. No need to send the same video twice.",

    originalButton:
      "Upload video from Files",

    share:
      "Share",

    ready:
      "Ready",

    preparing:
      "Preparing…",

    uploading:
      "Uploading…",

    checking:
      "Checking upload…",

    resuming:
      "Resuming…",

    retrying:
      "Connection interrupted — retrying…",

    saving:
      "Saving safely…",

    keepOpen:
      "please keep this page open",

    uploaded:
      "✓ Uploaded",

    chooseFirst:
      "Choose at least one file first.",

    oneFile:
      "file",

    manyFiles:
      "files",

    uploadedCount:
      "uploaded",

    success:
      "Everything is safely with us.",

    uploadMore:
      "Upload more",

    failedOne:
      "file needs another try.",

    failedMany:
      "files need another try."
  },


  es: {

    intro:
      "Viste momentos que nosotros nos perdimos.<br>Compártelos con nosotros. ♡",

    name:
      "Tu nombre (opcional)",

    choose:
      "📷 Elegir fotos y vídeos",

    originalTitle:
      "¿Vas a enviar un vídeo grande o largo?",

    originalExplanation:
      "Para vídeos grandes o largos, el iPhone puede preparar una versión más pequeña al elegirlos desde Fotos. Para enviar el archivo original, guárdalo primero en <strong>Archivos</strong> y súbelo aquí. No hace falta enviar el mismo vídeo dos veces.",

    originalButton:
      "Subir vídeo desde Archivos",

    share:
      "Compartir",

    ready:
      "Listo",

    preparing:
      "Preparando…",

    uploading:
      "Subiendo…",

    checking:
      "Comprobando…",

    resuming:
      "Continuando…",

    retrying:
      "La conexión se interrumpió — reintentando…",

    saving:
      "Guardando de forma segura…",

    keepOpen:
      "mantén esta página abierta",

    uploaded:
      "✓ Subido",

    chooseFirst:
      "Elige al menos un archivo.",

    oneFile:
      "archivo",

    manyFiles:
      "archivos",

    uploadedCount:
      "subidos",

    success:
      "Ya está todo con nosotros.",

    uploadMore:
      "Subir más",

    failedOne:
      "archivo necesita otro intento.",

    failedMany:
      "archivos necesitan otro intento."
  },


  mk: {

    intro:
      "Vie vidovte momenti shto nie ne gi vidovme.<br>Spodelete gi so nas. ♡",

    name:
      "Vashe ime (opcionalno)",

    choose:
      "📷 Izberete fotografii i videa",

    originalTitle:
      "Prakjate golemo ili dolgo video?",

    originalExplanation:
      "Za golemi ili dolgi videa, iPhone mozhe da napravi pomala verzija koga gi izbirate od Photos. Za da go ispratite originalniot fajl, prvo zachuvajte go vo <strong>Files</strong> i prikachete go podolu. Nema potreba da go prakjate istoto video dva pati.",

    originalButton:
      "Prikachi video od Files",

    share:
      "Spodeli",

    ready:
      "Podgotveno",

    preparing:
      "Se podgotvuva…",

    uploading:
      "Se prikachuva…",

    checking:
      "Se proveruva…",

    resuming:
      "Prodolzhuva…",

    retrying:
      "Konekcijata se prekina — se obiduvame povtorno…",

    saving:
      "Bezbedno se zachuvuva…",

    keepOpen:
      "ve molime ostavete ja stranicata otvorena",

    uploaded:
      "✓ Prikacheno",

    chooseFirst:
      "Izberete barem eden fajl.",

    oneFile:
      "fajl",

    manyFiles:
      "fajlovi",

    uploadedCount:
      "prikacheni",

    success:
      "Se e bezbedno zachuvano kaj nas.",

    uploadMore:
      "Prikachi ushte",

    failedOne:
      "fajl treba da se proba povtorno.",

    failedMany:
      "fajlovi treba da se probaat povtorno."
  }

};


let currentLanguage =
  localStorage.getItem('weddingLanguage') || 'en';


let selectedFiles =
  [];


let fileStates =
  [];


let uploading =
  false;


function t(key) {

  return translations[currentLanguage][key];
}


function setLanguage(lang) {

  currentLanguage =
    lang;


  localStorage.setItem(
    'weddingLanguage',
    lang
  );


  document.documentElement.lang =
    lang;


  document
    .querySelectorAll('.lang-button')
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.lang === lang
        );

      }
    );


  renderLanguage();
}


function renderLanguage() {

  document
    .getElementById('intro')
    .innerHTML =
      t('intro');


  document
    .getElementById('guestName')
    .placeholder =
      t('name');


  document
    .getElementById('chooseText')
    .innerText =
      t('choose');


  document
    .getElementById('originalTitle')
    .innerText =
      t('originalTitle');


  document
    .getElementById('originalExplanation')
    .innerHTML =
      t('originalExplanation');


  document
    .getElementById('originalButtonText')
    .innerText =
      t('originalButton');


  document
    .getElementById('uploadButton')
    .innerText =
      t('share');


  if (selectedFiles.length) {

    updateSummary();

    renderFileList();
  }
}


function filesSelected(fileList) {

  selectedFiles =
    Array.from(fileList);


  fileStates =
    selectedFiles.map(
      () => ({

        percent: 0,

        statusKey: 'ready',

        completed: false,

        failed: false,

        sessionUrl: null,

        fileId: null

      })
    );


  updateSummary();

  renderFileList();


  document
    .getElementById('overall')
    .innerHTML =
      '';
}


function updateSummary() {

  if (!selectedFiles.length) {

    document
      .getElementById('summary')
      .innerText =
        '';

    return;
  }


  const totalBytes =
    selectedFiles.reduce(
      (sum, file) =>
        sum + file.size,
      0
    );


  document
    .getElementById('summary')
    .innerText =

      selectedFiles.length +

      ' ' +

      (
        selectedFiles.length === 1
          ? t('oneFile')
          : t('manyFiles')
      )

      +

      ' · '

      +

      formatBytes(totalBytes);
}


function renderFileList() {

  const container =
    document.getElementById(
      'fileList'
    );


  container.innerHTML =
    '';


  selectedFiles.forEach(

    function(
      file,
      index
    ) {


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'file-card';


      const statusText =

        fileStates[index].completed

          ? t('uploaded')

          : t(
              fileStates[index].statusKey ||
              'ready'
            );


      card.innerHTML = `

        <div class="file-top">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-size">
            ${formatBytes(file.size)}
          </div>

        </div>


        <div class="status">

          <span id="status-${index}">
            ${statusText}
          </span>

          <span id="percent-${index}">
            ${fileStates[index].percent}%
          </span>

        </div>


        <div class="progress">

          <div
            id="bar-${index}"
            class="progress-bar"
            style="width:${fileStates[index].percent}%">
          </div>

        </div>
      `;


      container.appendChild(
        card
      );

    }
  );
}


async function startUpload() {

  if (uploading) {
    return;
  }


  if (!selectedFiles.length) {

    document
      .getElementById('overall')
      .innerText =
        t('chooseFirst');

    return;
  }


  uploading =
    true;


  document
    .getElementById('uploadButton')
    .disabled =
      true;


  const guestName =
    document
      .getElementById('guestName')
      .value;


  let completed =
    0;


  for (
    let index = 0;
    index < selectedFiles.length;
    index++
  ) {

    try {

      await uploadOneFile(
        selectedFiles[index],
        index,
        guestName
      );


      completed++;

    } catch (error) {

      console.error(
        error
      );


      fileStates[index].failed =
        true;


      updateProgress(
        index,
        fileStates[index].percent,
        'checking'
      );
    }


    document
      .getElementById('overall')
      .innerText =

        completed +

        ' / ' +

        selectedFiles.length +

        ' ' +

        t('uploadedCount');
  }


  uploading =
    false;


  document
    .getElementById('uploadButton')
    .disabled =
      false;


  const failed =
    fileStates.filter(
      state =>
        state.failed
    ).length;


  if (!failed) {


    document
      .getElementById('overall')
      .innerHTML = `

        <span class="success-symbol">
          ♡
        </span>

        ${t('success')}

        <button
          class="secondary"
          onclick="resetUploader()">

          ${t('uploadMore')}

        </button>
      `;


  } else {


    document
      .getElementById('overall')
      .innerHTML = `

        ${completed} / ${selectedFiles.length}
        ${t('uploadedCount')}

        <br><br>

        ${failed}

        ${
          failed === 1
            ? t('failedOne')
            : t('failedMany')
        }
      `;
  }
}


async function uploadOneFile(
  file,
  index,
  guestName
) {

  updateProgress(
    index,
    0,
    'preparing'
  );


  const session =
    await createUploadSession(
      file,
      guestName
    );


  if (
    !session ||
    !session.success ||
    !session.sessionUrl ||
    !session.fileId
  ) {

    throw new Error(

      session &&
      session.error

        ? session.error

        : 'Could not prepare upload.'
    );
  }


  fileStates[index].sessionUrl =
    session.sessionUrl;


  fileStates[index].fileId =
    session.fileId;


  let offset =
    0;


  let retries =
    0;


  while (
    offset <
    file.size
  ) {


    const end =
      Math.min(
        offset + CHUNK_SIZE,
        file.size
      );


    const chunk =
      file.slice(
        offset,
        end
      );


    try {


      const result =
        await uploadChunk(
          session.sessionUrl,
          chunk,
          offset,
          end,
          file.size,
          index
        );


      if (
        result.status === 200 ||
        result.status === 201
      ) {

        markComplete(
          index
        );

        return;
      }


      if (
        result.status === 308
      ) {


        const received =
          getReceivedOffset(
            result.rangeHeader
          );


        offset =

          received !== null

            ? received

            : end;


        retries =
          0;


        updateProgress(
          index,
          Math.min(
            99,
            Math.floor(
              (
                offset /
                file.size
              ) *
              100
            )
          ),
          'uploading'
        );


        continue;
      }


      if (
        await verifyCompleteFile(
          session.fileId,
          file.size
        )
      ) {

        markComplete(
          index
        );

        return;
      }


      throw new Error(
        'Unexpected upload response: ' +
        result.status
      );


    } catch (error) {


      if (
        fileStates[index].percent >= 95
      ) {

        updateFinalizing(
          index
        );

      } else {

        updateProgress(
          index,
          fileStates[index].percent,
          'checking'
        );
      }


      if (
        await verifyCompleteFile(
          session.fileId,
          file.size
        )
      ) {

        markComplete(
          index
        );

        return;
      }


      const status =
        await getServerUploadStatus(
          session.sessionUrl,
          file.size
        );


      if (
        status &&
        status.success
      ) {


        if (
          status.status === 200 ||
          status.status === 201
        ) {

          updateFinalizing(
            index
          );


          if (
            await waitForDriveFile(
              session.fileId,
              file.size
            )
          ) {

            markComplete(
              index
            );

            return;
          }
        }


        if (
          status.status === 308
        ) {


          const received =
            getReceivedOffset(
              status.range
            );


          if (
            received !== null
          ) {


            offset =
              received;


            retries =
              0;


            updateProgress(
              index,
              Math.min(
                99,
                Math.floor(
                  (
                    offset /
                    file.size
                  ) *
                  100
                )
              ),
              'resuming'
            );


            continue;
          }
        }
      }


      retries++;


      if (
        retries >
        MAX_RETRIES
      ) {


        updateFinalizing(
          index
        );


        if (
          await waitForDriveFile(
            session.fileId,
            file.size
          )
        ) {

          markComplete(
            index
          );

          return;
        }


        throw error;
      }


      updateProgress(
        index,
        fileStates[index].percent,
        'retrying'
      );


      await wait(
        Math.min(
          8000,
          1000 *
          Math.pow(
            2,
            retries - 1
          )
        )
      );
    }
  }


  updateFinalizing(
    index
  );


  const confirmed =
    await waitForDriveFile(
      session.fileId,
      file.size
    );


  if (
    confirmed
  ) {

    markComplete(
      index
    );

    return;
  }


  throw new Error(
    'Google did not confirm the completed file.'
  );
}


function markComplete(
  index
) {

  fileStates[index].completed =
    true;


  fileStates[index].failed =
    false;


  fileStates[index].percent =
    100;


  fileStates[index].statusKey =
    'uploaded';


  updateProgress(
    index,
    100,
    'uploaded'
  );
}


async function waitForDriveFile(
  fileId,
  expectedSize
) {

  for (
    let attempt = 0;
    attempt < 12;
    attempt++
  ) {


    const complete =
      await verifyCompleteFile(
        fileId,
        expectedSize
      );


    if (
      complete
    ) {

      return true;
    }


    await wait(
      1500
    );
  }


  return false;
}


async function verifyCompleteFile(
  fileId,
  expectedSize
) {

  try {


    const result =
      await callBackend({

        action:
          'checkFile',

        fileId:
          fileId,

        expectedSize:
          String(
            expectedSize
          )

      });


    return !!(
      result &&
      result.success &&
      result.complete
    );


  } catch (
    error
  ) {


    console.warn(
      'Could not verify file yet:',
      error
    );


    return false;
  }
}


async function getServerUploadStatus(
  sessionUrl,
  totalSize
) {

  try {


    return await callBackend({

      action:
        'queryUploadStatus',

      sessionUrl:
        sessionUrl,

      totalSize:
        String(
          totalSize
        )

    });


  } catch (
    error
  ) {


    console.warn(
      'Could not query upload status:',
      error
    );


    return null;
  }
}


function createUploadSession(
  file,
  guestName
) {

  return callBackend({

    action:
      'createUploadSession',

    fileName:
      file.name,

    mimeType:
      file.type ||
      'application/octet-stream',

    fileSize:
      String(
        file.size
      ),

    guestName:
      guestName || ''

  });
}


function callBackend(
  parameters
) {

  return new Promise(

    function(
      resolve,
      reject
    ) {


      const callbackName =

        '__callback_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() *
          1000000
        );


      const script =
        document.createElement(
          'script'
        );


      const timeout =
        setTimeout(

          function() {


            cleanup();


            reject(
              new Error(
                'Backend did not respond.'
              )
            );

          },

          30000
        );


      function cleanup() {


        clearTimeout(
          timeout
        );


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );
        }
      }


      window[
        callbackName
      ] =

        function(
          result
        ) {


          cleanup();


          resolve(
            result
          );
        };


      const params =
        new URLSearchParams({

          ...parameters,

          callback:
            callbackName

        });


      script.src =

        BACKEND_URL +

        '?' +

        params.toString();


      script.onerror =

        function() {


          cleanup();


          reject(
            new Error(
              'Could not contact backend.'
            )
          );
        };


      document.body
        .appendChild(
          script
        );

    }
  );
}


function uploadChunk(
  sessionUrl,
  chunk,
  start,
  end,
  totalSize,
  index
) {

  return new Promise(

    function(
      resolve,
      reject
    ) {


      const xhr =
        new XMLHttpRequest();


      xhr.open(
        'PUT',
        sessionUrl,
        true
      );


      xhr.setRequestHeader(

        'Content-Range',

        'bytes ' +

        start +

        '-' +

        (end - 1) +

        '/' +

        totalSize
      );


      xhr.upload.onprogress =

        function(
          event
        ) {


          if (
            !event.lengthComputable
          ) {

            return;
          }


          const currentBytes =
            start +
            event.loaded;


          const percent =
            Math.min(
              99,
              Math.floor(
                (
                  currentBytes /
                  totalSize
                ) *
                100
              )
            );


          updateProgress(
            index,
            percent,
            'uploading'
          );
        };


      xhr.onload =

        function() {


          resolve({

            status:
              xhr.status,

            rangeHeader:
              xhr.getResponseHeader(
                'Range'
              )

          });
        };


      xhr.onerror =

        function() {


          reject(
            new Error(
              'Network response was interrupted.'
            )
          );
        };


      xhr.ontimeout =

        function() {


          reject(
            new Error(
              'Upload timed out.'
            )
          );
        };


      xhr.timeout =
        120000;


      xhr.send(
        chunk
      );

    }
  );
}


function getReceivedOffset(
  rangeHeader
) {

  if (
    !rangeHeader
  ) {

    return null;
  }


  const match =
    String(
      rangeHeader
    )
      .match(
        /bytes=0-(\d+)/
      );


  if (
    !match
  ) {

    return null;
  }


  return (

    parseInt(
      match[1],
      10
    )

    +

    1
  );
}


function updateProgress(
  index,
  percent,
  statusKey
) {

  fileStates[index].percent =
    percent;


  fileStates[index].statusKey =
    statusKey;


  const bar =
    document.getElementById(
      'bar-' + index
    );


  const percentElement =
    document.getElementById(
      'percent-' + index
    );


  const statusElement =
    document.getElementById(
      'status-' + index
    );


  if (
    bar
  ) {

    bar.style.width =
      percent + '%';
  }


  if (
    percentElement
  ) {

    percentElement.innerText =
      percent + '%';
  }


  if (
    statusElement
  ) {

    statusElement.innerText =
      t(statusKey);
  }
}


function updateFinalizing(
  index
) {

  fileStates[index].percent =
    99;


  fileStates[index].statusKey =
    'saving';


  const bar =
    document.getElementById(
      'bar-' + index
    );


  const percentElement =
    document.getElementById(
      'percent-' + index
    );


  const statusElement =
    document.getElementById(
      'status-' + index
    );


  if (
    bar
  ) {

    bar.style.width =
      '100%';
  }


  if (
    percentElement
  ) {

    percentElement.innerText =
      '';
  }


  if (
    statusElement
  ) {

    statusElement.innerHTML =

      t('saving') +

      '<span class="saving-note">' +

      t('keepOpen') +

      '</span>';
  }
}


function resetUploader() {

  selectedFiles =
    [];


  fileStates =
    [];


  uploading =
    false;


  document
    .getElementById(
      'photoFiles'
    )
    .value =
      '';


  document
    .getElementById(
      'originalFiles'
    )
    .value =
      '';


  document
    .getElementById(
      'summary'
    )
    .innerText =
      '';


  document
    .getElementById(
      'fileList'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'overall'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'uploadButton'
    )
    .disabled =
      false;
}


function formatBytes(
  bytes
) {

  if (
    !bytes
  ) {

    return '0 B';
  }


  const units = [

    'B',
    'KB',
    'MB',
    'GB',
    'TB'

  ];


  const index =
    Math.floor(

      Math.log(
        bytes
      )

      /

      Math.log(
        1024
      )

    );


  return (

    (

      bytes /

      Math.pow(
        1024,
        index
      )

    )

    .toFixed(
      index >= 2
        ? 1
        : 0
    )

    +

    ' '

    +

    units[index]
  );
}


function escapeHtml(
  text
) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    text;


  return div.innerHTML;
}


function wait(
  milliseconds
) {

  return new Promise(

    resolve =>

      setTimeout(
        resolve,
        milliseconds
      )
  );
}


setLanguage(
  currentLanguage
);
