<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Lola & Santi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 60px;
      background: #f7f4ee;
      color: #292821;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .language-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-bottom: 32px;
    }

    .lang-button {
      width: auto;
      padding: 7px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #292821;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      opacity: .45;
    }

    .lang-button.active {
      opacity: 1;
      background: rgba(41, 40, 33, .08);
    }

    h1 {
      margin: 5px 0 8px;
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: normal;
    }

    .date {
      margin-bottom: 43px;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .intro {
      margin-bottom: 32px;
      font-size: 18px;
      line-height: 1.55;
    }

    input[type="text"] {
      width: 100%;
      padding: 17px;
      border: 1px solid #bbb;
      border-radius: 12px;
      background: white;
      color: #292821;
      font-size: 16px;
    }

    input[type="file"] {
      display: none;
    }

    .choose {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 19px;
      border: 1px solid #292821;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 17px;
    }

    .original-box {
      margin-top: 14px;
      border-top: 1px solid rgba(41,40,33,.14);
      border-bottom: 1px solid rgba(41,40,33,.14);
      text-align: left;
    }

    .original-box summary {
      padding: 15px 2px;
      cursor: pointer;
      list-style: none;
      font-size: 13px;
      opacity: .68;
    }

    .original-box summary::-webkit-details-marker {
      display: none;
    }

    .original-box summary::after {
      content: "＋";
      float: right;
    }

    .original-box[open] summary::after {
      content: "−";
    }

    .original-content {
      padding: 0 0 17px;
      font-size: 12px;
      line-height: 1.55;
      opacity: .72;
    }

    .original-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid rgba(41,40,33,.45);
      border-radius: 10px;
      background: transparent;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }

    .summary {
      margin: 18px 0;
      font-size: 14px;
      opacity: .7;
    }

    .file-card {
      margin: 10px 0;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.75);
      text-align: left;
    }

    .file-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .file-size {
      flex-shrink: 0;
      font-size: 12px;
      opacity: .6;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      opacity: .7;
    }

    .progress {
      height: 5px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(41,40,33,.12);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #292821;
      transition: width .15s ease;
    }

    .saving-note {
      margin-left: 5px;
      font-size: 11px;
      opacity: .65;
    }

    #uploadButton {
      width: 100%;
      margin-top: 6px;
      padding: 19px;
      border: 0;
      border-radius: 12px;
      background: #292821;
      color: white;
      cursor: pointer;
      font-size: 17px;
    }

    #uploadButton:disabled {
      opacity: .45;
    }

    #overall {
      margin-top: 22px;
      line-height: 1.55;
    }

    .success-symbol {
      display: block;
      margin-bottom: 7px;
      font-family: Georgia, serif;
      font-size: 27px;
    }

    .secondary {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #292821;
      border-radius: 12px;
      background: transparent;
      color: #292821;
      cursor: pointer;
      font-size: 15px;
    }

    @media (min-width: 700px) {
      .date {
        margin-bottom: 36px;
      }
    }
  </style>
</head>

<body>

<main class="wrap">

  <div class="language-switcher">

    <button
      class="lang-button active"
      data-lang="en"
      onclick="setLanguage('en')">
      EN
    </button>

    <button
      class="lang-button"
      data-lang="es"
      onclick="setLanguage('es')">
      ES
    </button>

    <button
      class="lang-button"
      data-lang="mk"
      onclick="setLanguage('mk')">
      MK
    </button>

  </div>


  <h1>
    Lola & Santi
  </h1>


  <div class="date">
    12 · 09 · 2026
  </div>


  <div
    id="intro"
    class="intro">
  </div>


  <input
    id="guestName"
    type="text"
  >


  <label
    id="chooseLabel"
    class="choose">

    <span id="chooseText"></span>

    <input
      id="photoFiles"
      type="file"
      accept="image/*,video/*"
      multiple
      onchange="filesSelected(this.files)"
    >

  </label>


  <details class="original-box">

    <summary id="originalTitle">
    </summary>

    <div class="original-content">

      <div id="originalExplanation">
      </div>

      <label class="original-button">

        <span id="originalButtonText">
        </span>

        <input
          id="originalFiles"
          type="file"
          multiple
          onchange="filesSelected(this.files)"
        >

      </label>

    </div>

  </details>


  <div
    id="summary"
    class="summary">
  </div>


  <div id="fileList">
  </div>


  <button
    id="uploadButton"
    type="button"
    onclick="startUpload()">
  </button>


  <div id="overall">
  </div>

</main>


<script>

const BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbx2vdi2nqGoyrrNToJhu0JrElylkWVM1knWDGrYA7LbFjWodyJDFM3S17uxhsq5Nv8ffg/exec';


const CHUNK_SIZE =
  8 * 1024 * 1024;


const MAX_RETRIES =
  5;


const translations = {

  en: {

    intro:

    name:
      "Your name (optional)",

    choose:
      "📷 Choose photos & videos",

    originalTitle:
      "Want to send the untouched original?",

    originalExplanation:
      "On iPhone, Photos may prepare a smaller version of large videos. For the original 4K file: in Photos tap <strong>Share → Save to Files</strong>, then select it below.",

    originalButton:
      "Upload original from Files",

    share:
      "Share",

    ready:
      "Ready",

    preparing:
      "Preparing…",

    uploading:
      "Uploading…",

    checking:
      "Checking upload…",

    resuming:
      "Resuming…",

    retrying:
      "Connection interrupted — retrying…",

    saving:
      "Saving safely…",

    keepOpen:
      "please keep this page open",

    uploaded:
      "✓ Uploaded",

    chooseFirst:
      "Choose at least one file first.",

    oneFile:
      "file",

    manyFiles:
      "files",

    uploadedCount:
      "uploaded",

    success:
      "Everything is safely with us.",

    uploadMore:
      "Upload more",

    failedOne:
      "file needs another try.",

    failedMany:
      "files need another try."
  },


  es: {

    intro:
      "Viste momentos que nosotros nos perdimos.<br>Compártelos con nosotros. ♡",

    name:
      "Tu nombre (opcional)",

    choose:
      "📷 Elegir fotos y vídeos",

    originalTitle:
      "¿Quieres enviar el archivo original?",

    originalExplanation:
      "En iPhone, Fotos puede preparar una versión más pequeña de los vídeos grandes. Para compartir el archivo 4K original: en Fotos toca <strong>Compartir → Guardar en Archivos</strong> y después selecciónalo aquí.",

    originalButton:
      "Subir original desde Archivos",

    share:
      "Compartir",

    ready:
      "Listo",

    preparing:
      "Preparando…",

    uploading:
      "Subiendo…",

    checking:
      "Comprobando…",

    resuming:
      "Continuando…",

    retrying:
      "La conexión se interrumpió — reintentando…",

    saving:
      "Guardando de forma segura…",

    keepOpen:
      "mantén esta página abierta",

    uploaded:
      "✓ Subido",

    chooseFirst:
      "Elige al menos un archivo.",

    oneFile:
      "archivo",

    manyFiles:
      "archivos",

    uploadedCount:
      "subidos",

    success:
      "Ya está todo con nosotros.",

    uploadMore:
      "Subir más",

    failedOne:
      "archivo necesita otro intento.",

    failedMany:
      "archivos necesitan otro intento."
  },


  mk: {

    intro:
      "Vie vidovte momenti shto nie ne gi vidovme.<br>Spodelete gi so nas. ♡",

    name:
      "Vashe ime (opcionalno)",

    choose:
      "📷 Izberete fotografii i videa",

    originalTitle:
      "Sakate da go ispratite originalniot fajl?",

    originalExplanation:
      "Na iPhone, Photos mozhe da napravi pomala verzija od golemi videa. Za originalniot 4K fajl: vo Photos odberete <strong>Share → Save to Files</strong>, a potoa izberete go fajlot podolu.",

    originalButton:
      "Prikachi original od Files",

    share:
      "Spodeli",

    ready:
      "Podgotveno",

    preparing:
      "Se podgotvuva…",

    uploading:
      "Se prikachuva…",

    checking:
      "Se proveruva…",

    resuming:
      "Prodolzhuva…",

    retrying:
      "Konekcijata se prekina — se obiduvame povtorno…",

    saving:
      "Bezbedno se zachuvuva…",

    keepOpen:
      "ve molime ostavete ja stranicata otvorena",

    uploaded:
      "✓ Prikacheno",

    chooseFirst:
      "Izberete barem eden fajl.",

    oneFile:
      "fajl",

    manyFiles:
      "fajlovi",

    uploadedCount:
      "prikacheni",

    success:
      "Se e bezbedno zachuvano kaj nas.",

    uploadMore:
      "Prikachi ushte",

    failedOne:
      "fajl treba da se proba povtorno.",

    failedMany:
      "fajlovi treba da se probaat povtorno."
  }

};


let currentLanguage =
  localStorage.getItem('weddingLanguage') || 'en';


let selectedFiles = [];

let fileStates = [];

let uploading = false;



function t(key) {
  return translations[currentLanguage][key];
}



function setLanguage(lang) {

  currentLanguage = lang;


  localStorage.setItem(
    'weddingLanguage',
    lang
  );


  document.documentElement.lang =
    lang;


  document
    .querySelectorAll('.lang-button')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.lang === lang
      );

    });


  renderLanguage();
}



function renderLanguage() {

  document.getElementById('intro').innerHTML =
    t('intro');


  document.getElementById('guestName').placeholder =
    t('name');


  document.getElementById('chooseText').innerText =
    t('choose');


  document.getElementById('originalTitle').innerText =
    t('originalTitle');


  document.getElementById('originalExplanation').innerHTML =
    t('originalExplanation');


  document.getElementById('originalButtonText').innerText =
    t('originalButton');


  document.getElementById('uploadButton').innerText =
    t('share');


  if (selectedFiles.length) {
    updateSummary();
    renderFileList();
  }
}



function filesSelected(fileList) {

  selectedFiles =
    Array.from(fileList);


  fileStates =
    selectedFiles.map(() => ({

      percent: 0,

      statusKey: 'ready',

      completed: false,

      failed: false,

      sessionUrl: null,

      fileId: null

    }));


  updateSummary();

  renderFileList();


  document.getElementById('overall').innerHTML =
    '';
}



function updateSummary() {

  if (!selectedFiles.length) {

    document.getElementById('summary').innerText =
      '';

    return;
  }


  const totalBytes =
    selectedFiles.reduce(
      (sum, file) => sum + file.size,
      0
    );


  document.getElementById('summary').innerText =

    selectedFiles.length +

    ' ' +

    (
      selectedFiles.length === 1
        ? t('oneFile')
        : t('manyFiles')
    )

    +

    ' · '

    +

    formatBytes(totalBytes);
}



function renderFileList() {

  const container =
    document.getElementById('fileList');


  container.innerHTML =
    '';


  selectedFiles.forEach(
    function(file, index) {

      const card =
        document.createElement('div');


      card.className =
        'file-card';


      const statusText =
        fileStates[index].completed
          ? t('uploaded')
          : t(fileStates[index].statusKey || 'ready');


      card.innerHTML = `

        <div class="file-top">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-size">
            ${formatBytes(file.size)}
          </div>

        </div>


        <div class="status">

          <span id="status-${index}">
            ${statusText}
          </span>

          <span id="percent-${index}">
            ${fileStates[index].percent}%
          </span>

        </div>


        <div class="progress">

          <div
            id="bar-${index}"
            class="progress-bar"
            style="width:${fileStates[index].percent}%">
          </div>

        </div>
      `;


      container.appendChild(card);

    }
  );
}



async function startUpload() {

  if (uploading) {
    return;
  }


  if (!selectedFiles.length) {

    document.getElementById('overall').innerText =
      t('chooseFirst');

    return;
  }


  uploading = true;


  document.getElementById('uploadButton').disabled =
    true;


  const guestName =
    document.getElementById('guestName').value;


  let completed = 0;


  for (
    let index = 0;
    index < selectedFiles.length;
    index++
  ) {

    try {

      await uploadOneFile(
        selectedFiles[index],
        index,
        guestName
      );


      completed++;

    } catch (error) {

      console.error(error);


      fileStates[index].failed =
        true;


      updateProgress(
        index,
        fileStates[index].percent,
        'checking'
      );
    }


    document.getElementById('overall').innerText =

      completed +

      ' / ' +

      selectedFiles.length +

      ' ' +

      t('uploadedCount');
  }


  uploading = false;


  document.getElementById('uploadButton').disabled =
    false;


  const failed =
    fileStates.filter(
      state => state.failed
    ).length;


  if (!failed) {

    document.getElementById('overall').innerHTML = `

      <span class="success-symbol">♡</span>

      ${t('success')}

      <button
        class="secondary"
        onclick="resetUploader()">

        ${t('uploadMore')}

      </button>
    `;

  } else {

    document.getElementById('overall').innerHTML = `

      ${completed} / ${selectedFiles.length}
      ${t('uploadedCount')}

      <br><br>

      ${failed}
      ${
        failed === 1
          ? t('failedOne')
          : t('failedMany')
      }
    `;
  }
}



async function uploadOneFile(
  file,
  index,
  guestName
) {

  updateProgress(
    index,
    0,
    'preparing'
  );


  const session =
    await createUploadSession(
      file,
      guestName
    );


  if (
    !session ||
    !session.success ||
    !session.sessionUrl ||
    !session.fileId
  ) {

    throw new Error(
      session && session.error
        ? session.error
        : 'Could not prepare upload.'
    );
  }


  fileStates[index].sessionUrl =
    session.sessionUrl;


  fileStates[index].fileId =
    session.fileId;


  let offset = 0;

  let retries = 0;


  while (offset < file.size) {

    const end =
      Math.min(
        offset + CHUNK_SIZE,
        file.size
      );


    const chunk =
      file.slice(
        offset,
        end
      );


    try {

      const result =
        await uploadChunk(
          session.sessionUrl,
          chunk,
          offset,
          end,
          file.size,
          index
        );


      if (
        result.status === 200 ||
        result.status === 201
      ) {

        markComplete(index);

        return;
      }


      if (result.status === 308) {

        const received =
          getReceivedOffset(
            result.rangeHeader
          );


        offset =
          received !== null
            ? received
            : end;


        retries = 0;


        updateProgress(
          index,
          Math.min(
            99,
            Math.floor(
              (offset / file.size) * 100
            )
          ),
          'uploading'
        );


        continue;
      }


      if (
        await verifyCompleteFile(
          session.fileId,
          file.size
        )
      ) {

        markComplete(index);

        return;
      }


      throw new Error(
        'Unexpected upload response: ' +
        result.status
      );

    } catch (error) {

      if (
        fileStates[index].percent >= 95
      ) {

        updateFinalizing(index);

      } else {

        updateProgress(
          index,
          fileStates[index].percent,
          'checking'
        );
      }


      if (
        await verifyCompleteFile(
          session.fileId,
          file.size
        )
      ) {

        markComplete(index);

        return;
      }


      const status =
        await getServerUploadStatus(
          session.sessionUrl,
          file.size
        );


      if (
        status &&
        status.success
      ) {

        if (
          status.status === 200 ||
          status.status === 201
        ) {

          updateFinalizing(index);


          if (
            await waitForDriveFile(
              session.fileId,
              file.size
            )
          ) {

            markComplete(index);

            return;
          }
        }


        if (status.status === 308) {

          const received =
            getReceivedOffset(
              status.range
            );


          if (received !== null) {

            offset =
              received;


            retries = 0;


            updateProgress(
              index,
              Math.min(
                99,
                Math.floor(
                  (offset / file.size) * 100
                )
              ),
              'resuming'
            );


            continue;
          }
        }
      }


      retries++;


      if (retries > MAX_RETRIES) {

        updateFinalizing(index);


        if (
          await waitForDriveFile(
            session.fileId,
            file.size
          )
        ) {

          markComplete(index);

          return;
        }


        throw error;
      }


      updateProgress(
        index,
        fileStates[index].percent,
        'retrying'
      );


      await wait(
        Math.min(
          8000,
          1000 *
          Math.pow(
            2,
            retries - 1
          )
        )
      );
    }
  }


  updateFinalizing(index);


  const confirmed =
    await waitForDriveFile(
      session.fileId,
      file.size
    );


  if (confirmed) {

    markComplete(index);

    return;
  }


  throw new Error(
    'Google did not confirm the completed file.'
  );
}



function markComplete(index) {

  fileStates[index].completed =
    true;


  fileStates[index].failed =
    false;


  fileStates[index].percent =
    100;


  fileStates[index].statusKey =
    'uploaded';


  updateProgress(
    index,
    100,
    'uploaded'
  );
}



async function waitForDriveFile(
  fileId,
  expectedSize
) {

  for (
    let attempt = 0;
    attempt < 12;
    attempt++
  ) {

    const complete =
      await verifyCompleteFile(
        fileId,
        expectedSize
      );


    if (complete) {
      return true;
    }


    await wait(1500);
  }


  return false;
}



async function verifyCompleteFile(
  fileId,
  expectedSize
) {

  try {

    const result =
      await callBackend({

        action:
          'checkFile',

        fileId:
          fileId,

        expectedSize:
          String(expectedSize)

      });


    return !!(
      result &&
      result.success &&
      result.complete
    );

  } catch (error) {

    console.warn(
      'Could not verify file yet:',
      error
    );


    return false;
  }
}



async function getServerUploadStatus(
  sessionUrl,
  totalSize
) {

  try {

    return await callBackend({

      action:
        'queryUploadStatus',

      sessionUrl:
        sessionUrl,

      totalSize:
        String(totalSize)

    });

  } catch (error) {

    console.warn(
      'Could not query upload status:',
      error
    );


    return null;
  }
}



function createUploadSession(
  file,
  guestName
) {

  return callBackend({

    action:
      'createUploadSession',

    fileName:
      file.name,

    mimeType:
      file.type ||
      'application/octet-stream',

    fileSize:
      String(file.size),

    guestName:
      guestName || ''

  });
}



function callBackend(parameters) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =

        '__callback_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() *
          1000000
        );


      const script =
        document.createElement(
          'script'
        );


      const timeout =
        setTimeout(
          function() {

            cleanup();


            reject(
              new Error(
                'Backend did not respond.'
              )
            );

          },
          30000
        );


      function cleanup() {

        clearTimeout(timeout);


        delete window[
          callbackName
        ];


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );
        }
      }


      window[callbackName] =
        function(result) {

          cleanup();


          resolve(result);
        };


      const params =
        new URLSearchParams({

          ...parameters,

          callback:
            callbackName

        });


      script.src =

        BACKEND_URL +

        '?' +

        params.toString();


      script.onerror =
        function() {

          cleanup();


          reject(
            new Error(
              'Could not contact backend.'
            )
          );
        };


      document.body.appendChild(
        script
      );

    }
  );
}



function uploadChunk(
  sessionUrl,
  chunk,
  start,
  end,
  totalSize,
  index
) {

  return new Promise(
    function(resolve, reject) {

      const xhr =
        new XMLHttpRequest();


      xhr.open(
        'PUT',
        sessionUrl,
        true
      );


      xhr.setRequestHeader(
        'Content-Range',

        'bytes ' +

        start +

        '-' +

        (end - 1) +

        '/' +

        totalSize
      );


      xhr.upload.onprogress =
        function(event) {

          if (!event.lengthComputable) {
            return;
          }


          const currentBytes =
            start +
            event.loaded;


          const percent =
            Math.min(
              99,
              Math.floor(
                (
                  currentBytes /
                  totalSize
                ) *
                100
              )
            );


          updateProgress(
            index,
            percent,
            'uploading'
          );
        };


      xhr.onload =
        function() {

          resolve({

            status:
              xhr.status,

            rangeHeader:
              xhr.getResponseHeader(
                'Range'
              )

          });
        };


      xhr.onerror =
        function() {

          reject(
            new Error(
              'Network response was interrupted.'
            )
          );
        };


      xhr.ontimeout =
        function() {

          reject(
            new Error(
              'Upload timed out.'
            )
          );
        };


      xhr.timeout =
        120000;


      xhr.send(chunk);

    }
  );
}



function getReceivedOffset(
  rangeHeader
) {

  if (!rangeHeader) {
    return null;
  }


  const match =
    String(rangeHeader)
      .match(
        /bytes=0-(\d+)/
      );


  if (!match) {
    return null;
  }


  return (
    parseInt(
      match[1],
      10
    ) +
    1
  );
}



function updateProgress(
  index,
  percent,
  statusKey
) {

  fileStates[index].percent =
    percent;


  fileStates[index].statusKey =
    statusKey;


  const bar =
    document.getElementById(
      'bar-' + index
    );


  const percentElement =
    document.getElementById(
      'percent-' + index
    );


  const statusElement =
    document.getElementById(
      'status-' + index
    );


  if (bar) {

    bar.style.width =
      percent + '%';
  }


  if (percentElement) {

    percentElement.innerText =
      percent + '%';
  }


  if (statusElement) {

    statusElement.innerText =
      t(statusKey);
  }
}



function updateFinalizing(index) {

  fileStates[index].percent =
    99;


  fileStates[index].statusKey =
    'saving';


  const bar =
    document.getElementById(
      'bar-' + index
    );


  const percentElement =
    document.getElementById(
      'percent-' + index
    );


  const statusElement =
    document.getElementById(
      'status-' + index
    );


  if (bar) {

    bar.style.width =
      '100%';
  }


  if (percentElement) {

    percentElement.innerText =
      '';
  }


  if (statusElement) {

    statusElement.innerHTML =

      t('saving') +

      '<span class="saving-note">' +

      t('keepOpen') +

      '</span>';
  }
}



function resetUploader() {

  selectedFiles =
    [];


  fileStates =
    [];


  uploading =
    false;


  document.getElementById('photoFiles').value =
    '';


  document.getElementById('originalFiles').value =
    '';


  document.getElementById('summary').innerText =
    '';


  document.getElementById('fileList').innerHTML =
    '';


  document.getElementById('overall').innerHTML =
    '';


  document.getElementById('uploadButton').disabled =
    false;
}



function formatBytes(bytes) {

  if (!bytes) {
    return '0 B';
  }


  const units = [
    'B',
    'KB',
    'MB',
    'GB',
    'TB'
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (

    (
      bytes /
      Math.pow(
        1024,
        index
      )
    )

    .toFixed(
      index >= 2
        ? 1
        : 0
    )

    +

    ' '

    +

    units[index]
  );
}



function escapeHtml(text) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    text;


  return div.innerHTML;
}



function wait(milliseconds) {

  return new Promise(

    resolve =>

      setTimeout(
        resolve,
        milliseconds
      )
  );
}



setLanguage(
  currentLanguage
);

</script>
